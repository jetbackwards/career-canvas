services:
  career-canvas:
    build:
      context: .
      target: build
    command: node --watch server.mjs
    environment:
      PORT: 3000
      DATA_FILE: /data/career-canvas.json
    volumes:
      - .:/app
      - career_canvas_data:/data
  
  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_PROXY=http://career-canvas:3000
    ports:
      - "5173:5173"
    volumes:
      - ./vite.config.js:/app/vite.config.js:ro
      - ./client:/app/client
      - ./public:/app/public
    depends_on:
      - career-canvas

volumes:
  career_canvas_data:

